name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup toolchain
        uses: jdx/mise-action@v4
      - name: Install dependencies
        run: bundle install
      - name: Lint
        run: just lint
      - name: Build and proof
        run: just test
        env:
          PROOF_EXTERNAL: '0'
